<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DJ-JK VR - Immersive Music Production</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #vr-root { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #vr-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; color: #00e5ff; font-family: monospace; z-index: 9999; }
      #vr-loading h1 { font-size: 2rem; margin-bottom: 1rem; text-shadow: 0 0 20px rgba(0,229,255,0.5); }
      #vr-loading p { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
      .vr-spinner { width: 40px; height: 40px; border: 3px solid rgba(0,229,255,0.2); border-top-color: #00e5ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="vr-loading">
      <h1>DJ-JK VR</h1>
      <div class="vr-spinner"></div>
      <p>Loading immersive DJ experience...</p>
      <p style="margin-top: 0.5rem; font-size: 0.75rem;">Best experienced with Meta Quest 3 or Apple Vision Pro</p>
    </div>
    <div id="vr-root"></div>
    <script type="module" src="./vr-main.tsx"></script>
  </body>
</html>
